<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本神話・妖怪 古地図絵図</title>
    <style>
        /* 全体スタイル（白・ベージュ・薄黄色ベース） */
        :root {
            --bg-color: #f7f3e3;
            --map-bg: #e6dec3;
            --border-color: #8c6d46;
            --text-color: #3d2b1f;
            --accent-red: #8b0000;
            --accent-blue: #1c3d5a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Yu Mincho", "Hiragino Mincho ProN", "Sawarabi Mincho", serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* ヘッダー */
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(247, 243, 227, 0.9);
            border: 2px solid var(--border-color);
            padding: 10px 20px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        /* 地図ビューポート（Google Map風操作領域） */
        #map-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
            background-color: var(--map-bg);
            background-image: radial-gradient(#d3c7a1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        #map-container:active {
            cursor: grabbing;
        }

        /* 地図コンテンツ（画像の拡大縮小・平行移動） */
        #map-content {
            position: absolute;
            transform-origin: 0 0;
            width: 1200px;
            height: 900px;
        }

        /* ベースとなる日本地図画像 */
        #base-map {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            opacity: 0.85;
            filter: sepia(0.3) contrast(1.1);
        }

        /* ピン（マーカー）のスタイル */
        .pin {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #5c4033;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
            z-index: 5;
        }

        .pin:hover {
            transform: scale(1.3);
            z-index: 6;
        }

        .pin-yokai {
            background-color: #b84c3a;
            color: #fff;
        }

        .pin-kami {
            background-color: #d4a359;
            color: #3d2b1f;
        }

        .pin-label {
            position: absolute;
            top: 35px;
            white-space: nowrap;
            background: rgba(247, 243, 227, 0.85);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 3px;
            pointer-events: none;
        }

        /* コントロールボタン */
        .controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .controls button {
            width: 40px;
            height: 40px;
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        .controls button:hover {
            background-color: #eae3cd;
        }

        /* 詳細モーダルダイアログ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 20;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--bg-color);
            border: 3px double var(--border-color);
            width: 90%;
            max-width: 650px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.4);
            position: relative;
            border-radius: 6px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: var(--border-color);
        }

        .modal-title {
            font-size: 1.6rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 0;
            color: var(--accent-red);
        }

        .modal-region {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }

        .detail-item {
            margin-bottom: 15px;
        }

        .detail-item h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            border-left: 4px solid var(--border-color);
            padding-left: 8px;
        }

        .detail-item p {
            margin: 0;
            line-height: 1.6;
            font-size: 0.95rem;
            padding-left: 12px;
        }

        /* イラスト・画像表示エリア */
        .illustration-container {
            text-align: center;
            margin: 15px 0;
            background: #eae3cd;
            padding: 10px;
            border: 1px solid var(--border-color);
        }

        .illustration-container img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }

        .source-link {
            font-size: 0.8rem;
            color: #555;
            margin-top: 5px;
            word-break: break-all;
        }

        .source-link a {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <header>
        <h1>日本神話伝承・妖怪古地図</h1>
    </header>

    <div id="map-container">
        <div id="map-content">
            <!-- アップロード画像を反映させた地図ベース -->
            <img id="base-map" src="https://www.illust-box.jp/db_img/sozai/00015/152914/watermark.jpg" alt="古地図">
            <!-- マーカー群（JavaScriptで自動生成） -->
            <div id="pins-layer"></div>
        </div>
    </div>

    <div class="controls">
        <button id="zoom-in">+</button>
        <button id="zoom-out">-</button>
        <button id="zoom-reset">⟲</button>
    </div>

    <!-- 詳細ダイアログ -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="modal-close">&times;</span>
            <h2 id="modal-title" class="modal-title">名称</h2>
            <div id="modal-region" class="modal-region">地方 / 場所</div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // 神話・妖怪データ
        const data = [
            // 北海道
            { region: "北海道", category: "妖怪", name: "アコロカムイ", location: "噴火湾（内浦湾）周辺", x: 800, y: 190, content: "巨大なタコのような巨大海洋生物。船を丸呑みにする巨大さを持ち、赤く巨大な体が海面を覆い尽くすとされる。", origin: "アイヌ民話において、海の巨大生物や奇怪な現象への畏怖が具現化したもの。" },
            { region: "北海道", category: "妖怪", name: "アイヌラックル", location: "北海道全域", x: 830, y: 150, content: "基本的には英雄神だが、地域によっては悪霊や化け物（ウェンカムイ）退治の物語において、異形の敵として語り継がれる場合がある。", origin: "自然の脅威や不可解な災害を英雄と対峙する存在として例えたことから生じた。" },
            { region: "北海道", category: "神様", name: "カムイチカプ", location: "北海道全域", x: 780, y: 130, content: "コタン（集落）を護る村護りの神。夜間に音もなく飛び、人々に異変を知らせる。", origin: "アイヌの人々がシマフクロウの夜行性や観察力の高さに感謝し、保護神として崇めた。", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Blakiston%27s_Fish_Owl_in_Hokkaido.jpg/400px-Blakiston%27s_Fish_Owl_in_Hokkaido.jpg", sourceName: "Wikimedia Commons - Blakiston's Fish Owl", sourceUrl: "https://commons.wikimedia.org/wiki/File:Blakiston%27s_Fish_Owl_in_Hokkaido.jpg" },
            { region: "北海道", category: "神様", name: "キムンカムイ", location: "北海道の山林", x: 850, y: 120, content: "山を支配する高位の神。肉と皮（毛皮）を人々に与えるために下界へ現れるとされる。", origin: "山の恵みと命の尊厳に対する感謝と祈りから生まれた。" },

            // 東北
            { region: "東北", category: "妖怪", name: "座敷わらし", location: "岩手県を中心とする東北地方", x: 700, y: 310, content: "家の座敷に住み着く子供の姿をした妖怪。居着いた家は繁栄し、去ると衰退すると言われる。", origin: "家の盛衰や、過去の貧困による乳幼児の早世に対する切ない思いが背景にあるとされる。", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Zashikiwarashi_by_Gyokuen.jpg/300px-Zashikiwarashi_by_Gyokuen.jpg", sourceName: "Wikimedia Commons - Zashikiwarashi", sourceUrl: "https://commons.wikimedia.org/wiki/File:Zashikiwarashi_by_Gyokuen.jpg" },
            { region: "東北", category: "妖怪", name: "なまはげ", location: "秋田県男鹿市", x: 670, y: 290, content: "鬼の面をかぶり、怠け者を戒めたり無病息災を祈ったりして家々を訪れる怪異・来訪神的な妖怪。", origin: "冬の厳しい気候のなか、年の節目に規律を守らせるための風習から生じた。" },
            { region: "東北", category: "神様", name: "オシラサマ", location: "岩手県・青森県など", x: 710, y: 270, content: "家の神・養蚕の神・馬の神。桑の木で作られたペアの人形に布を重ねて祀る。", origin: "娘と馬の悲恋説話（馬頭観音説話）を起源とし、家庭の幸福や養蚕の成功を祈って生まれた。" },

            // 関東
            { region: "関東", category: "妖怪", name: "小豆洗い", location: "東京都・神奈川県など", x: 670, y: 460, content: "川のほとりで「ショキショキ」と小豆を洗う音を立てる妖怪。姿は見えないことが多い。", origin: "夜の川のせせらぎや風の音が、小豆を洗う音に聞こえたことから生じた。", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Azukiarai_from_Ehon_Hyaku_Monogatari.jpg/300px-Azukiarai_from_Ehon_Hyaku_Monogatari.jpg", sourceName: "『絵本百物語』小豆洗（Wikimedia Commons）", sourceUrl: "https://commons.wikimedia.org/wiki/File:Azukiarai_from_Ehon_Hyaku_Monogatari.jpg" },
            { region: "関東", category: "妖怪", name: "河童", location: "茨城県（牛久沼など）", x: 690, y: 440, content: "水辺に棲み、頭の皿が乾くと力を失う。相撲を好み、人を水中に引き込むこともある。", origin: "水難事故の防止や、水辺の自然災害に対する警鐘から生まれた。" },
            { region: "関東", category: "神様", name: "平将門公", location: "東京都千代田区（神田神社など）", x: 660, y: 475, content: "江戸・東京の勝負運や厄除け、地域防衛の守護神。", origin: "平安時代の武将・平将門の怨霊を鎮めるため御霊信仰として祀られ、守護神となった。" },

            // 中部
            { region: "中部", category: "妖怪", name: "輪入道", location: "石川県など", x: 570, y: 410, content: "燃え盛る牛車の車輪の中央に恐ろしい男の顔がある妖怪。見ると魂を抜かれるとされる。", origin: "車輪の軋み音や火災の恐怖、悪事への戒めとして伝承された。", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Wanyudo_from_Gazu_Hyakki_Yako.jpg/300px-Wanyudo_from_Gazu_Hyakki_Yako.jpg", sourceName: "鳥山石燕『画図百鬼夜行』輪入道（Wikimedia Commons）", sourceUrl: "https://commons.wikimedia.org/wiki/File:Wanyudo_from_Gazu_Hyakki_Yako.jpg" },
            { region: "中部", category: "神様", name: "建御名方神", location: "長野県諏訪市（諏訪大社）", x: 610, y: 440, content: "風・水・農耕・武勇を司る強力な大神。", origin: "国譲り神話で諏訪に逃れた天津神・国津神の葛藤と、地主神との融合から誕生。" },

            // 近畿
            { region: "近畿", category: "妖怪", name: "酒呑童子", location: "京都府（大江山）", x: 510, y: 480, content: "鬼の頭領。京の都から姫君たちをさらって乱暴を働いたが、源頼光らに退治された。", origin: "都に従わなかった地方勢力や山賊への畏怖と政権側の正当化から生まれた。" },
            { region: "近畿", category: "神様", name: "天照大御神", location: "三重県伊勢市（伊勢神宮）", x: 540, y: 530, content: "皇室の祖神であり、太陽・日本全体を照らす最高神。", origin: "稲作に不可欠な太陽への自然崇拝と、古代国家の統合の象徴として誕生。" },

            // 中国
            { region: "中国", category: "妖怪", name: "一反木綿", location: "鳥取県・島根県など", x: 420, y: 480, content: "長さ約10メートルの白い布のような妖怪。夜空を飛んで人の首に巻き付く。", origin: "暗闇で干してあった布が風で飛んできた恐怖や子供への夜出注意から生じた。" },
            { region: "中国", category: "神様", name: "大国主大神", location: "島根県出雲市（出雲大社）", x: 390, y: 495, content: "国造りを行った神。目に見えない「縁（えにし）」を司る結びの最高神。", origin: "出雲地方の古代勢力の神話と、大和王権への国譲り神話から誕生。" },

            // 四国
            { region: "四国", category: "妖怪", name: "子泣き爺", location: "徳島県三好市", x: 440, y: 570, content: "赤ん坊の泣き声を上げて山道に転がり、拾い上げた人間にとびつき石のように重くなって押し潰す。", origin: "山奥での怪音現象や、険しい山道での疲労・危険防止の警告から生まれた。" },
            { region: "四国", category: "神様", name: "大山積神", location: "愛媛県今治市（大山祇神社）", x: 390, y: 580, content: "日本全体の山々・海・武運を司る強大な総鎮守。", origin: "海の要衝である大三島に鎮座し、数々の武将から兜や鎧が奉納されて発展。" },

            // 九州・沖縄
            { region: "九州", category: "妖怪", name: "山童", location: "熊本県・長崎県など", x: 280, y: 640, content: "冬になると山に入り、夏になると川に戻って河童（ガラッパ）になるとされる妖怪。", origin: "季節による労働（山林労働と漁労）の変化と自然現象が結びついた。" },
            { region: "九州", category: "神様", name: "菅原道真公", location: "福岡県太宰府市（太宰府天満宮）", x: 290, y: 590, content: "学問・誠実・厄除けを司る至高の神様。", origin: "無実の罪で左遷され没した道真の祟りを恐れ、慰霊と学徳の称賛のために創建。" },
            { region: "沖縄", category: "妖怪", name: "キジムナー", location: "沖縄県全域", x: 530, y: 780, content: "ガジュマルの古い巨木に棲む赤髪の子供の妖怪。魚の目が好物で、親しくなると富をもたらすが、怒らせると家を滅ぼす。", origin: "ガジュマルの木に対する畏敬の念や、奇妙な怪現象・漁の成否から生まれた。" },
            { region: "沖縄", category: "神様", name: "アマミキヨ", location: "沖縄本島（久高島・斎場御嶽）", x: 570, y: 770, content: "琉球開闢（かいびゃく）の創世女神。琉球列島と人間を造ったとされる。", origin: "琉球王国の国家神話として、島々の形成と王権の正当性を説明するために誕生。" }
        ];

        // マーカーの動的生成
        const pinsLayer = document.getElementById('pins-layer');
        data.forEach((item, index) => {
            const pin = document.createElement('div');
            pin.className = `pin ${item.category === '妖怪' ? 'pin-yokai' : 'pin-kami'}`;
            pin.style.left = `${item.x}px`;
            pin.style.top = `${item.y}px`;
            pin.innerText = item.category === '妖怪' ? '妖' : '神';

            const label = document.createElement('div');
            label.className = 'pin-label';
            label.innerText = item.name;
            pin.appendChild(label);

            pin.addEventListener('click', (e) => {
                e.stopPropagation();
                showDetail(item);
            });

            pinsLayer.appendChild(pin);
        });

        // スクロール・パン・ズーム処理
        const container = document.getElementById('map-container');
        const content = document.getElementById('map-content');

        let scale = 1;
        let pannedX = 0;
        let pannedY = 0;
        let isDragging = false;
        let startX, startY;

        function updateTransform() {
            content.style.transform = `translate(${pannedX}px, ${pannedY}px) scale(${scale})`;
        }

        // 初期位置を中央に設定
        pannedX = (window.innerWidth - 1200) / 2;
        pannedY = (window.innerHeight - 900) / 2;
        updateTransform();

        // ドラッグ移動
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - pannedX;
            startY = e.clientY - pannedY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            pannedX = e.clientX - startX;
            pannedY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // マウスホイールズーム
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 0.1;
            if (e.deltaY < 0) {
                scale = Math.min(scale + zoomFactor, 2.5);
            } else {
                scale = Math.max(scale - zoomFactor, 0.6);
            }
            updateTransform();
        });

        // ボタン操作
        document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(scale + 0.2, 2.5); updateTransform(); });
        document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(scale - 0.2, 0.6); updateTransform(); });
        document.getElementById('zoom-reset').addEventListener('click', () => {
            scale = 1;
            pannedX = (window.innerWidth - 1200) / 2;
            pannedY = (window.innerHeight - 900) / 2;
            updateTransform();
        });

        // モーダル詳細表示
        const modal = document.getElementById('detail-modal');
        function showDetail(item) {
            document.getElementById('modal-title').innerText = `${item.name} (${item.category})`;
            document.getElementById('modal-region').innerText = `【${item.region}】 場所：${item.location}`;

            let bodyHtml = `
                <div class="detail-item">
                    <h3>概要・内容</h3>
                    <p>${item.content}</p>
                </div>
                <div class="detail-item">
                    <h3>誕生経緯</h3>
                    <p>${item.origin}</p>
                </div>
            `;

            if (item.image) {
                bodyHtml += `
                    <div class="illustration-container">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="source-link">
                            出典・参考資料: <a href="${item.sourceUrl}" target="_blank" rel="noopener">${item.sourceName}</a>
                        </div>
                    </div>
                `;
            }

            document.getElementById('modal-body').innerHTML = bodyHtml;
            modal.style.display = 'flex';
        }

        document.getElementById('modal-close').addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
